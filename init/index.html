<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Init</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden; 
      }

      [data-screen="auswertung"] {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        text-align: center;
      }

      [data-screen="auswertung"][hidden] {
        display: none;
      }

      #ergebnis-zeit {
        font-size: 6rem;
        font-weight: bold;
        font-size: 8vh;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 2px #000;
        color: #265cc0;
      }

      h1 {
        font-size: 6rem;
        font-weight: bold;
        font-size: 12vh;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 5px #43738a;
        color: #265cc0;
      }

      [data-screen="intro"] {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        text-align: left;
        margin-inline: 30vh;
      }

      [data-screen="intro"] > div {
        flex: 1;                      
        display: flex;
        flex-direction: column;
        align-items: center;          
        justify-content: center;
      }

      [data-screen="intro"][hidden] {
        display: none;
      }

      [data-screen="intro"] > div:first-child {
        flex: 0 0 66.66%;
      }

      [data-screen="intro"] > div:last-child {
        flex: 0 0 33.33%;
      }

      button {
        align-items: center;
        background-color: #fff;
        border-radius: 24px;
        border-color: #77a6f3;
        box-shadow: rgba(0, 0, 0, .2) 0 3px 5px -1px,rgba(0, 0, 0, .14) 0 6px 10px 0,rgba(0, 0, 0, .12) 0 1px 18px 0;
        box-sizing: border-box;
        color: #292b2c;
        cursor: pointer;
        display: inline-flex;
        font-size: 2.5vh;
        font-weight: 500;
        height: 48px;
        justify-content: center;
        max-width: 100%;
        overflow: visible;
        padding: 2px 24px;
        position: relative;
        text-align: center;
        text-transform: none;
        transition: box-shadow 280ms cubic-bezier(.4, 0, .2, 1),opacity 15ms linear 30ms,transform 270ms cubic-bezier(0, 0, .2, 1) 0ms;
      }

      button:hover {
        background: #F6F9FE;
        color: #174ea6;
      }

      .intro-gif-wrapper {
        position: relative;
        width: 408px;
        height: 508px;
      }

      .intro-gif-wrapper .stop-game {
        position: absolute;
        inset: 0;
        border-radius: 8px;
      }

      .intro-gif-wrapper .stop-game__title {
        font-size: 8vh; 
      }

      .intro-gif-wrapper .stop-game__timer {
        font-size: 3vh;
      }

    </style>
  </head>
  <body>
    <div style="position: relative; width: 100vw; height: 100vh; overflow: hidden;">

      <section data-screen="intro" hidden>
        <div>
          <h1>Beweg dich!</h1>
          <button id="start" disabled>Modell wird geladen…</button>
          <p id="intro-msg"></p>
        </div>
        <div>
          <div class="intro-gif-wrapper">
            <img id="tutorial-img" src="img/gatze.gif" alt="Tanzende Katze" style="width:100%; height:100%; object-fit: cover;">
            <div id="tutorial-stop"></div>
        </div>
        </div>
      </section>

      <section data-screen="spiel" hidden>
        <canvas id="canvas" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 2; transition: all 2s ease-in-out; filter: blur(0px); opacity: 1;"></canvas>
    
        <video id="video" autoplay playsinline muted style="display: none;"></video>

        <div id="motion-value" style="position: absolute; top: 24px; left: 24px; z-index: 3; color: #fff; font: bold 32px sans-serif; text-shadow: 0 0 4px #000;">0.00</div>

        <div id="activity-bar"></div>

        <div id="activity-comment"></div>
        <div id="stop-game"></div>
      </section>

      <section data-screen="auswertung" hidden>
        <h2>Du hast<br>
        <span id="ergebnis-zeit"></span><br>
        zum Reagieren benötigt.</h2>
        <p id="ergebnis-text"></p>
      </section>
    
    </div>

    

    <script type="module" src="/src/main.ts"></script>
    
  </body>
</html>
