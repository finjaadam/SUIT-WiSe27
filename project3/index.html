<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaktion 3</title>
    <style>
      html, body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      #status {
        position: absolute;
        top: 24px;
        left: 24px;
        margin: 0;
        font-size: 24px;
        z-index: 2;
      }

      [data-screen="start"] {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4vh;
        padding-inline: 15vw;
      }

      [data-screen][hidden] {
        display: none;
      }

      [data-screen="start"] h1 {
        margin: 0;
        font-size: 9vh;
        font-weight: bold;
        text-align: center;
        text-shadow: 0 0 5px #43738a;
        color: #265cc0;
      }

      [data-screen="start"] ul {
        margin: 0;
        font-size: 3.5vh;
        line-height: 1.5;
      }

      #body-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: max-content;
        max-width: 80vw;
        margin: 0;
        padding: 16px 32px;
        font-size: 8vh;
        text-align: center;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 16px;
        z-index: 3;
      }

      #body-hint[hidden] {
        display: none;
      }

      /* Memory board: two cards on each side, the live skeleton in the middle */
      #pose-cards {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-areas: "a live b" "c live d";
        place-content: center;
        gap: 4vh;
        z-index: 2;
      }

      #live {
        grid-area: live;
        position: relative;
      }

      /* The pose that fits best lies faintly on the player's skeleton */
      #best-pose {
        position: absolute;
        inset: 0;
        margin: auto;
        height: 100%;
        opacity: 0.4;
        mix-blend-mode: multiply;
        clip-path: inset(6%);
        pointer-events: none;
        z-index: 1;
      }

      #canvas {
        display: block;
        width: 60vh;
        height: 84vh;
        object-fit: cover;
        background: #f4f7fd;
        border-radius: 16px;
        transform: scaleX(-1);
      }

      .pose-card {
        position: relative;
      }

      .pose-card img {
        display: block;
        height: 40vh;
      }

      .pose-ring {
        position: absolute;
        right: -3vh;
        bottom: -3vh;
        width: 8vh;
        height: 8vh;
        transform: rotate(-90deg);
      }

      .pose-ring circle {
        fill: #fff;
        stroke: #e3ecfb;
        stroke-width: 5;
      }

      .pose-ring .progress {
        fill: none;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.15s linear, stroke 0.15s linear;
      }

      button {
        align-items: center;
        background-color: #fff;
        border-radius: 24px;
        border-color: #77a6f3;
        box-shadow: rgba(0, 0, 0, .2) 0 3px 5px -1px, rgba(0, 0, 0, .14) 0 6px 10px 0, rgba(0, 0, 0, .12) 0 1px 18px 0;
        color: #292b2c;
        cursor: pointer;
        display: inline-flex;
        font-size: 2.5vh;
        font-weight: 500;
        height: 48px;
        justify-content: center;
        padding: 2px 24px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted hidden></video>
    <p id="status">Modell wird geladen…</p>

    <section data-screen="start">
      <h1>Löse das Frage-Antwort-Memory</h1>
      <ul>
        <li>Drehe die Karten um, indem du die Posen einnimmst</li>
        <li>Logge die Frage-Antwort-Paare ein, indem du laut „einloggen“ sagst, und sage „zurück“, wenn du neue Karten auswählen möchtest</li>
      </ul>
      <button id="start" disabled>Modell wird geladen…</button>
    </section>

    <section data-screen="spiel" hidden>
      <h1 id="body-hint" hidden>Stell dich so hin, dass du von Kopf bis Fuß zu sehen bist.</h1>
      <div id="pose-cards">
        <div id="live">
          <img id="best-pose" hidden alt="">
          <canvas id="canvas"></canvas>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
