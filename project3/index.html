<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaktion 3</title>
    <style>
      html, body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      #canvas {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        pointer-events: none;
        /* Mirror the view so it behaves like a mirror */
        transform: scaleX(-1);
      }

      #status {
        position: absolute;
        top: 24px;
        left: 24px;
        margin: 0;
        font-size: 24px;
        z-index: 2;
      }

      /* The skeleton only appears once the game started */
      body[data-screen="start"] #canvas {
        display: none;
      }

      body[data-screen="spiel"] #canvas {
        inset: auto;
        bottom: 20px;
        left: 20px;
        width: 240px;
        height: 135px;
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        z-index: 10;
      }

      [data-screen="start"] {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4vh;
        padding-inline: 15vw;
      }

      [data-screen][hidden] {
        display: none;
      }

      [data-screen="start"] h1 {
        margin: 0;
        font-size: 9vh;
        font-weight: bold;
        text-align: center;
        text-shadow: 0 0 5px #43738a;
        color: #265cc0;
      }

      [data-screen="start"] ul {
        margin: 0;
        font-size: 3.5vh;
        line-height: 1.5;
      }

      #body-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: max-content;
        max-width: 80vw;
        margin: 0;
        padding: 16px 32px;
        font-size: 8vh;
        text-align: center;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 16px;
        z-index: 3;
      }

      #body-hint[hidden] {
        display: none;
      }

      /* Memory board in the middle of the screen */
      #pose-cards {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(2, auto);
        place-content: center;
        gap: 3vh;
        z-index: 2;
      }

      #pose-cards img {
        height: 42vh;
      }

      #pose-debug {
        position: absolute;
        top: 16px;
        right: 16px;
        margin: 0;
        padding: 12px 16px;
        font-size: 20px;
        color: #fff;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        z-index: 3;
      }

      button {
        align-items: center;
        background-color: #fff;
        border-radius: 24px;
        border-color: #77a6f3;
        box-shadow: rgba(0, 0, 0, .2) 0 3px 5px -1px, rgba(0, 0, 0, .14) 0 6px 10px 0, rgba(0, 0, 0, .12) 0 1px 18px 0;
        color: #292b2c;
        cursor: pointer;
        display: inline-flex;
        font-size: 2.5vh;
        font-weight: 500;
        height: 48px;
        justify-content: center;
        padding: 2px 24px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted hidden></video>
    <canvas id="canvas"></canvas>
    <p id="status">Modell wird geladen…</p>

    <section data-screen="start">
      <h1>Löse das Frage-Antwort-Memory</h1>
      <ul>
        <li>Drehe die Karten um, indem du die Posen einnimmst</li>
        <li>Logge die Frage-Antwort-Paare ein, indem du laut „einloggen“ sagst, und sage „zurück“, wenn du neue Karten auswählen möchtest</li>
      </ul>
      <button id="start" disabled>Modell wird geladen…</button>
    </section>

    <section data-screen="spiel" hidden>
      <h1 id="body-hint" hidden>Stell dich so hin, dass du von Kopf bis Fuß zu sehen bist.</h1>
      <pre id="pose-debug"></pre>
      <div id="pose-cards"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
