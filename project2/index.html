<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaktion 2</title>
    <style>
      html, body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      #canvas {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        /* Mirror the view so it behaves like a mirror */
        transform: scaleX(-1);
      }

      #status {
        position: absolute;
        top: 24px;
        left: 24px;
        font-size: 24px;
      }

      #base {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
      }

      #controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 16px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 10;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
    </style>
  </head>
  <body>
    <!--
    <video id="video" autoplay playsinline muted hidden></video>
    <canvas id="canvas"></canvas>
    <p id="status">Modell wird geladen…</p>
    <script type="module" src="/src/main.ts"></script>
-->
    <div id="controls">
      <div class="control-group">
        <label for="tiltX">Vor / Zurück (Pitch): <span id="valX">0</span>°</label>
        <input type="range" id="tiltX" min="-0.35" max="0.35" step="0.01" value="0" />
      </div>
      <div class="control-group">
        <label for="tiltZ">Links / Rechts (Roll): <span id="valZ">0</span>°</label>
        <input type="range" id="tiltZ" min="-0.35" max="0.35" step="0.01" value="0" />
      </div>
    </div>

    <canvas id="base"></canvas>
    <script type="module" src="/src/threejsBase.js"></script>
  </body>
</html>
