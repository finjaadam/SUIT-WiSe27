<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaktion 2</title>
    <style>
      html, body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      #canvas {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        pointer-events: none;
        /* Mirror the view so it behaves like a mirror */
        transform: scaleX(-1);
      }

      #status {
        position: absolute;
        top: 24px;
        left: 24px;
        margin: 0;
        font-size: 24px;
        z-index: 2;
      }

      /* From the intro on the board fills the screen, the skeleton moves to a small corner view */
      body:is([data-screen="intro"], [data-screen="spiel"]) #canvas {
        inset: auto;
        bottom: 20px;
        left: 20px;
        width: 240px;
        height: 135px;
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        z-index: 10;
      }

      body:is([data-screen="intro"], [data-screen="spiel"]) #status {
        top: auto;
        bottom: 132px;
        left: 32px;
        font-size: 14px;
        z-index: 11;
      }

      #lean-debug {
        position: absolute;
        top: 16px;
        right: 16px;
        margin: 0;
        padding: 12px 16px;
        font-size: 16px;
        color: #fff;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        z-index: 20;
      }

      #lean-debug[hidden] {
        display: none;
      }

      #base {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        z-index: 1;
      }

      body[data-screen="start"] #base {
        display: none;
      }


      [data-screen] {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        text-align: center;
        pointer-events: none;
      }

      [data-screen][hidden] {
        display: none;
      }

      [data-screen] h1 {
        margin: 0;
        padding: 16px 32px;
        font-size: 8vh;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 16px;
      }

      #start-hint {
        min-height: 1.2em;
        margin: 0;
        font-size: 3.5vh;
      }

      #start-progress-track {
        width: 40vw;
        height: 3vh;
        background: rgba(0, 0, 0, 0.15);
        border-radius: 999px;
        overflow: hidden;
      }

      [data-screen="intro"] {
        justify-content: flex-start;
        padding-top: 24px;
      }

      /* Above the board */
      [data-screen="intro"] h1 {
        position: relative;
        z-index: 2;
      }

      #cat {
        position: absolute;
        right: 4vw;
        bottom: 0;
        height: 65vh;
        z-index: 2;
      }

      #start-progress {
        width: 0;
        height: 100%;
        background: #265cc0;
      }
    </style>
  </head>
  <body>
    
    <video id="video" autoplay playsinline muted hidden></video>
    <canvas id="canvas"></canvas>
    <p id="status">Modell wird geladen…</p>
    <pre id="lean-debug" hidden></pre>
        
    <section data-screen="start">
      <h1>Stell dich auf ein Bein</h1>
      <div id="start-progress-track"><div id="start-progress"></div></div>
      <p id="start-hint"></p>
    </section>

    <!-- Board only appears once the one-leg stand was recognized -->
    <canvas id="base"></canvas>

    <section data-screen="intro" hidden>
      <h1>Neige deinen Oberkörper um das Brett zu steuern</h1>
      <img id="cat" src="img/cat_intro.gif" alt="Katze auf einem Bein neigt den Oberkörper nach vorne, hinten, links und rechts">
    </section>

    <section data-screen="spiel" hidden>
      <h1 id="game-hint">Steh gerade, das Brett wird ausgerichtet</h1>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
